# --- Disable accidental layout cycle ---
unbind Space

# --- Pane Splitting (intuitive keys) ---
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- 4x2 grid layout (prefix + l). Overrides default last-window. ---
# Use prefix + L (capital) for last-window.
unbind l
bind l run-shell "~/.tmux/grid-4x2.sh"
bind L last-window

# --- Pane Navigation (Alt+Arrow, no prefix needed) ---
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# --- Window (Tab) Management ---
# Create new window (tab): Prefix + c  (default, kept)
# Next/prev window (Ctrl+Left/Right, no prefix needed):
bind -n C-Left previous-window
bind -n C-Right next-window
# Rename window (tab): Prefix + ,  (default, kept)
# Quick rename shortcut:
bind r command-prompt -I "#W" "rename-window '%%'"

# --- Pane Titles & Borders ---
set -g pane-border-status top
# Pane title is pushed via OSC escapes by zsh precmd / chpwd hooks (see
# zsh/.zshrc) and by `wt` when spawning lanes. No #() shell-sub here, so
# tmux never has to fork to redraw the border — eliminates the flash.
set -g pane-border-format ' #{pane_index}: #{?@pane_manual,#{@pane_manual},#{?#{!=:#{pane_title},#{host_short}},#{pane_title},-}} '
set -g pane-border-style 'fg=#504945'
set -g pane-active-border-style 'fg=#a9b665'
set -g pane-border-lines heavy
bind t command-prompt -p "Pane title:" "set-option -p @pane_manual '%%'"

# --- Window Numbering ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Quality of Life ---
set -g extended-keys on
set -g extended-keys-format csi-u
set -g history-limit 10000
set -g display-time 2000
set -sg escape-time 0
setw -g mode-keys vi
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# --- Truecolor passthrough ---
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:RGB'

# --- Status Bar (Gruvbox Material Medium Dark) ---
set -g status-style 'bg=#32302f fg=#d4be98'
set -g status-left '#[bg=#45403d,fg=#d4be98,bold] #S #[bg=#32302f] '
set -g status-right-length 80
set -g status-interval 5
set -g status-right '#[fg=#928374] #(~/.tmux/tmux-status.sh) #[fg=#d4be98]%H:%M '
setw -g window-status-style 'fg=#7c6f64 bg=#32302f'
setw -g window-status-current-style 'fg=#1d2021,bg=#a9b665,bold'
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '
setw -g window-status-bell-style 'fg=#1d2021,bg=#ea6962,bold'
set -g message-style 'bg=#504945 fg=#d4be98'
set -g message-command-style 'bg=#504945 fg=#d4be98'

# --- Agent board (prefix + A) ---
bind A new-window -n agent-board 'watch -tcn2 ~/.tmux/agent-board.sh'
