[general]
import = ["~/.config/alacritty/themes/gruvbox_material_medium_dark.toml"]
live_config_reload = true

[window]
opacity = 1.0
padding = { x = 8, y = 8 }
dynamic_padding = true
decorations = "buttonless"
option_as_alt = "Both"

[font]
size = 13.0

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true
