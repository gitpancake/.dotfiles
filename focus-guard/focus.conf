# keepalive_timeout 0 disables HTTP keep-alive server-wide, so nginx sends
# `Connection: close` on every response. Without this, Chromium pools a
# keep-alive socket to 127.0.0.1:80/443 and keeps hitting the block page even
# after /etc/hosts is open. Set per-server (was per-location on the probe only).

server {
    listen 80 default_server;
    server_name _;

    root /usr/local/var/focus;
    index index.html;

    keepalive_timeout 0;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;

    location = /__focus_guard_probe__ {
        default_type text/plain;
        return 200 "FOCUS_GUARD_SENTINEL";
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /usr/local/var/focus/certs/cert.pem;
    ssl_certificate_key /usr/local/var/focus/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/local/var/focus;
    index index.html;

    keepalive_timeout 0;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;

    location = /__focus_guard_probe__ {
        default_type text/plain;
        return 200 "FOCUS_GUARD_SENTINEL";
    }

    location / {
        try_files $uri /index.html;
    }
}
